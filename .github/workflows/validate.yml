name: Validate teaching lab

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build Blockly application
        working-directory: frontend
        run: |
          npm install
          npm run build
      - name: Check Python syntax
        run: python -m compileall -q runtime
      - name: Check shell scripts
        run: bash -n setup_kafka.sh stop_kafka.sh diagnose_kafka.sh
      - name: Validate Docker Compose definitions
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.ha.yml config --quiet
